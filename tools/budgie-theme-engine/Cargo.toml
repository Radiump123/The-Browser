[package]
name = "budgie-theme-engine"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Hot-reloadable JSON theme engine for Budgie Browser"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
