[package]
name = "budgie-control-daemon"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Budgie Browser GX-style resource control daemon"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.30"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
